spring.application.name=coffeeshop
spring.datasource.url=jdbc:mysql://localhost:3307/coffee_shop
spring.datasource.username=${DB_USER:taskhub}
spring.datasource.password=${DB_PASSWORD:taskhub}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080
# JWT: the secret comes from the environment (plain text, min 32 bytes). Never in the repo.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5
