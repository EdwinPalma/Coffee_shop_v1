spring.application.name=coffeeshop
# JWT: the secret comes from the environment (plain text, min 32 bytes). Never in the repo.
spring.config.import=optional:file:./.env[.properties]
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5

spring.datasource.url=jdbc:mysql://localhost:3307/coffee_shop
spring.datasource.username=root
spring.datasource.password=mysql123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080

